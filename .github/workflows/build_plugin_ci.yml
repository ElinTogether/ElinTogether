name: Elin Plugin CI Deploy

on:
  workflow_call:
    inputs:
      plugin_name:
        required: true
        type: string
      plugin_path:
        required: true
        type: string
      tag_prefix:
        required: true
        type: string
      release_name_prefix:
        required: true
        type: string
      force_prerelease:
        required: false
        type: boolean
        default: false
      artifact_name_prefix:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  build-and-upload:
    name: Build
    runs-on: windows-latest

    outputs:
      file_version: ${{ steps.build.outputs.file_version }}
      file_version_short: ${{ steps.build.outputs.file_version_short }}

    strategy:
      fail-fast: false
      matrix:
        version: [nightly, stable]
        configuration: [Debug, Release]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            ${{ inputs.plugin_name }}/
            assets/
            package/
            Directory.Build.props
            global.json
          sparse-checkout-cone-mode: false

      - name: Checkout Deps
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: ${{ matrix.version }}
          ref: ${{ matrix.version }}
          repository: gottyduke/Elin.Plugins.BuildDeps
          ssh-key: ${{ secrets.DEPS_DEPLOY_KEY }}

      - name: Setup Deps Tag
        id: deps
        shell: pwsh
        run: |
          pushd ${{ github.workspace }}\${{ matrix.version }}
          $tag = git describe --tags --abbrev=0 ${{ matrix.version }}
          popd
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Setup DotNet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ github.workspace }}\global.json
          cache: true
          cache-dependency-path: |
            ${{ github.workspace }}\${{ inputs.plugin_path }}\packages.lock.json

      - name: Setup Packages
        run: |
          dotnet restore ${{ github.workspace }}\${{ inputs.plugin_path }}\ --locked-mode

      - name: Build
        id: build
        env:
          ElinGamePath: ${{ github.workspace }}\${{ matrix.version }}
        shell: pwsh
        run: |
          $cfgBase = '${{ matrix.configuration }}'
          $config = if ('${{ matrix.version }}' -eq 'nightly') { "${cfgBase}Nightly" } else { $cfgBase }

          $outDir = "${{ github.workspace }}\out\${{ matrix.version }}-${{ matrix.configuration }}"
          dotnet build ${{ github.workspace }}\${{ inputs.plugin_path }}\${{ inputs.plugin_name }}.csproj -o $outDir -c $config --no-restore

          $dllPath = Join-Path -Path $outDir -ChildPath "${{ inputs.plugin_name }}.dll"
          $fileVersion = (Get-Item -Path $dllPath).VersionInfo.FileVersion
          $fileVersionShort = $fileVersion.Split('.')[0..2] -join '.'
          $debugSuffix = if ('${{ matrix.configuration }}' -eq 'Debug') { 'debug' } else { 'release' }

          $artifactName = "${{ inputs.artifact_name_prefix }}-ci-build-$fileVersionShort-${{ steps.deps.outputs.tag }}-$debugSuffix"

          echo "file_version=$fileVersion" >> $env:GITHUB_OUTPUT
          echo "file_version_short=$fileVersionShort" >> $env:GITHUB_OUTPUT
          echo "file_name=$artifactName" >> $env:GITHUB_OUTPUT
          echo "out_dir=$outDir" >> $env:GITHUB_OUTPUT
          echo "debug_suffix=$debugSuffix" >> $env:GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.file_name }}
          path: ${{ steps.build.outputs.out_dir }}

  release:
    name: Release
    needs: build-and-upload
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: ${{ github.workspace }}/dist

      - name: Pack Artifacts & Changelog
        id: pack
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag_prefix }}-${{ needs.build-and-upload.outputs.file_version_short }}"
          $outDir = "${{ github.workspace }}/release"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          Get-ChildItem -Path "${{ github.workspace }}/dist" -Directory | ForEach-Object {
            Compress-Archive -Path "$($_.FullName)/*" -DestinationPath "$outDir/$($_.Name).zip" -Force
          }

          $verParts = "${{ needs.build-and-upload.outputs.file_version_short }}".Split('.')
          $series = "$($verParts[0]).$($verParts[1])"

          $lastTag = @(git tag --list "${{ inputs.tag_prefix }}-*" --merged HEAD --sort=-v:refname |
            ? { $_ -ne $tag })[0]

          $seriesBump = -not $lastTag -or $lastTag -notlike "${{ inputs.tag_prefix }}-$series.*"

          if ($lastTag -and $seriesBump) {
            $prevSeries = ($lastTag -replace "^${{ inputs.tag_prefix }}-") -replace '\.\d+$'
            $seriesFirst = @(git tag --list "${{ inputs.tag_prefix }}-$prevSeries.*" --merged HEAD --sort=v:refname)[0]
            if ($seriesFirst) { $lastTag = $seriesFirst }
          }

          $prerelease = if ('${{ inputs.force_prerelease }}' -eq 'true') { 'true' } else { (-not $seriesBump).ToString().ToLower() }

          $skipTypes = '^\s*(chore|docs|ci)(\([^)]*\))?!?\s*:'
          $sep = [char]0x1f

          $changelog = if ($lastTag) {
            $lastTagSha = git rev-parse "$($lastTag)^{commit}"
            $headSha = git rev-parse HEAD

            # $lastTag..HEAD is exclusive of $lastTag, inclusive of HEAD (= the commit
            # that triggered this run, since checkout pins github.sha)
            $entries = @(
              git log "$($lastTag)..HEAD" --no-merges --date=format:"%y-%m-%d %H:%M" --pretty=format:"%cd$sep%h$sep%s$sep%an" |
                ? { $_ } |
                % {
                  $f = $_ -split $sep, 4
                  [pscustomobject]@{ Date = $f[0]; Hash = $f[1]; Subject = $f[2]; Author = $f[3] }
                } |
                ? { $_.Subject -notmatch $skipTypes } |
                % { "- $($_.Date) $($_.Hash) $($_.Subject) @$($_.Author)" })

            if (-not $entries) { $entries = @("- no user-facing changes") }

            @("Last Tag ($lastTag): $lastTagSha", "This Tag ($tag): $headSha", "") + $entries
          } else {
            @("Initial release", "")
          }

          $changelog | Set-Content -Path "${{ github.workspace }}/CHANGELOG.txt" -Encoding utf8
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          echo "::notice::$tag -> $(if ($prerelease -eq 'true') { 'prerelease' } else { 'release' }) (last tag: $lastTag)"

      - name: Create or Update Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.pack.outputs.tag }}
          name: ${{ needs.build-and-upload.outputs.file_version }}
          draft: false
          prerelease: ${{ steps.pack.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.pack.outputs.prerelease != 'true' }}
          generate_release_notes: false
          body_path: ${{ github.workspace }}/CHANGELOG.txt
          files: ${{ github.workspace }}/release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr-comment:
    name: PR Comment
    if: |
      !cancelled() &&
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
    needs: build-and-upload
    runs-on: ubuntu-latest
    steps:
      - name: Update PR Comment
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              core.warning('No PR number found in event payload, skipping comment.');
              return;
            }

            const buildResult = '${{ needs.build-and-upload.result }}';
            const buildSucceeded = buildResult === 'success';
            const statusIcon = buildSucceeded ? '✅' : '❌';
            const statusText = buildSucceeded ? 'Succeeded' : 'Failed';

            let artifactRows = '';
            try {
              const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });

              if (artifacts.artifacts.length > 0) {
                artifacts.artifacts.sort((a, b) => a.name.localeCompare(b.name));
                const lines = artifacts.artifacts.map(a => {
                  const sizeMb = (a.size_in_bytes / (1024 * 1024)).toFixed(1);
                  const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${a.id}`;
                  const expireUtc = new Date(a.expires_at).toISOString().replace('T', ' ').substring(0, 16) + ' UTC';
                  return `| \`${a.name}\` | ${sizeMb} MB | ${expireUtc} | [Download](${url}) |`;
                });
                artifactRows = [
                  '| Artifact | Size | Expires (UTC) | Link |',
                  '|---|---|---|---|',
                  ...lines,
                ].join('\n');
              } else {
                artifactRows = '_No artifacts were produced._';
              }
            } catch (err) {
              core.warning(`Failed to list artifacts: ${err.message}`);
              artifactRows = '_Unable to fetch artifact list._';
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitSha = context.sha.substring(0, 7);
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            const branchName = context.payload.pull_request?.head?.ref || context.ref.replace('refs/heads/', '');

            const body = [
              '<!-- ci-build-comment -->',
              `## ${statusIcon} CI Build — ${statusText}`,
              '',
              '| | |',
              '|---|---|',
              `| **Commit** | [\`${commitSha}\`](${commitUrl}) |`,
              `| **Branch** | \`${branchName}\` |`,
              '',
              '### 📦 Artifacts',
              '',
              artifactRows,
              '',
              `> [View workflow run](${runUrl})`,
            ].join('\n');

            const marker = '<!-- ci-build-comment -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing comment #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              core.info('Created new PR comment');
            }
